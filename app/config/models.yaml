# Static fallback for the OpenRouter free-model catalog.
#
# The live list comes from OpenRouter's public /models endpoint (see
# app/config/models.py) — free models rotate, so that is the source of truth.
# This file is only used when the fetch fails (offline, rate-limited, schema
# drift) so the agent picker in the UI always has something to offer.
#
# Snapshot taken 2026-07-31. Filtered the same way the live fetch filters:
# id ends in ":free", lab in {openai, google, nvidia}, text output, and not a
# classifier. Refresh it by running:
#
#   curl -s https://openrouter.ai/api/v1/models | python3 -c "..."   # see README
#
# Free models are capped at 20 requests/minute and 50 requests/day until 10
# credits have been purchased on the account, then 1000/day.

models:
  - id: nvidia/nemotron-3-ultra-550b-a55b:free
    name: "NVIDIA: Nemotron 3 Ultra (free)"
    lab: nvidia
    context_length: 1000000
    max_completion_tokens: 65536

